name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install test tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.4 pyyaml==6.0.3

      - name: Lint
        run: ruff check skills && ruff format --check skills

      - name: Test
        run: python -m pytest -q skills/repo-bootstrap/tests

  skill-format:
    name: skill-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate against the Agent Skills spec
        run: pipx run --spec skills-ref==0.1.1 agentskills validate skills/repo-bootstrap
